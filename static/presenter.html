<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAR Travel · Presenter</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --fg: #e8e8ea;
      --muted: #8a8a90;
      --line: #1f1f24;
      --accent: #ff5722;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --card: #111114;
      --card-2: #15151a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100vh; width: 100vw;
      background: var(--bg); color: var(--fg);
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .mono {
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    a { color: var(--accent); text-decoration: none; }
    button { font-family: inherit; }

    #root {
      display: grid;
      grid-template-rows: 56px 56px 1fr;
      grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr);
      grid-template-areas:
        "header header"
        "filters filters"
        "list   detail";
      height: 100vh;
    }

    /* Header */
    header {
      grid-area: header;
      display: flex; align-items: center; gap: 24px;
      padding: 0 20px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; flex-direction: column; line-height: 1.05; }
    .brand .small { font-size: 9px; letter-spacing: 3px; color: var(--muted); }
    .brand .name { font-size: 15px; font-weight: 600; }
    .brand .accent { color: var(--accent); }
    .stats {
      display: flex; gap: 14px; flex: 1; align-items: baseline;
    }
    .stat {
      display: inline-flex; align-items: baseline; gap: 6px;
      font-size: 11px; color: var(--muted);
    }
    .stat .n { font-size: 16px; font-weight: 700; color: var(--fg); }
    .stat.red .n { color: var(--bad); }
    .stat.amber .n { color: var(--warn); }
    .updated {
      font-size: 10px; letter-spacing: 1.5px;
      color: var(--muted); text-transform: uppercase;
    }

    /* Filter row */
    #filters {
      grid-area: filters;
      display: flex; gap: 8px; align-items: center;
      padding: 10px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }
    #filters input, #filters select {
      background: #0e0e12;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--fg); padding: 7px 10px;
      font-size: 13px; font-family: inherit;
      min-width: 130px;
    }
    #filters input:focus, #filters select:focus {
      outline: none; border-color: var(--accent);
    }
    #filters input.search { flex: 1; min-width: 200px; max-width: 320px; }
    .seg {
      display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    }
    .seg button {
      background: var(--card-2); color: var(--muted); border: none;
      padding: 7px 11px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer;
    }
    .seg button.on { background: var(--card); color: var(--fg); }
    .seg button.red.on  { color: var(--bad); }
    .seg button.amber.on { color: var(--warn); }
    .seg button + button { border-left: 1px solid var(--line); }

    .reset {
      background: transparent; color: var(--muted); border: 1px solid var(--line);
      border-radius: 4px; padding: 7px 11px; font-size: 11px;
      letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
    }
    .reset:hover { color: var(--fg); border-color: var(--accent); }

    /* List */
    #list-wrap {
      grid-area: list;
      overflow-y: auto;
      border-right: 1px solid var(--line);
    }
    #list-wrap::-webkit-scrollbar { width: 4px; }
    #list-wrap::-webkit-scrollbar-thumb { background: #2a2a30; }

    .row {
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 12px;
      align-items: start;
    }
    .row:hover { background: #131318; }
    .row.active { background: #18181f; box-shadow: inset 3px 0 0 var(--accent); }

    .row .road {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 700;
      color: var(--accent); letter-spacing: -0.02em;
    }
    .row.no-road .road { color: var(--muted); font-weight: 500; font-size: 11px; }

    .row .body { min-width: 0; }
    .row .title {
      font-size: 13px; line-height: 1.4; color: var(--fg);
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .row .meta {
      font-size: 10px; letter-spacing: 1.5px;
      color: var(--muted); text-transform: uppercase;
      margin-top: 4px;
    }
    .row .sev {
      font-size: 9px; letter-spacing: 2px;
      padding: 3px 7px; border-radius: 999px;
      text-transform: uppercase;
      align-self: start;
    }
    .row .sev.red    { background: rgba(248,113,113,0.15); color: var(--bad); }
    .row .sev.amber  { background: rgba(251,191,36,0.12); color: var(--warn); }
    .row .sev.green  { background: rgba(52,211,153,0.1); color: var(--good); }
    .row .sev.info   { background: var(--card-2); color: var(--muted); }

    .group-head {
      padding: 14px 20px 6px;
      font-size: 9px; letter-spacing: 3px; color: var(--muted);
      text-transform: uppercase; font-weight: 500;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 1;
    }
    .group-head .n { color: var(--fg); margin-left: 6px; }

    /* Detail */
    #detail {
      grid-area: detail;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    #detail-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--muted);
      font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
    }
    #detail-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    #detail-body::-webkit-scrollbar { width: 4px; }
    #detail-body::-webkit-scrollbar-thumb { background: #2a2a30; }
    #detail-body h2 {
      margin: 0 0 6px; font-size: 18px; font-weight: 600; line-height: 1.3;
      letter-spacing: -0.01em;
    }
    #detail-body .sub {
      font-size: 10px; letter-spacing: 2px; color: var(--muted);
      text-transform: uppercase; margin-bottom: 14px;
    }
    #detail-body .summary-card {
      background: var(--card-2); border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      padding: 12px 14px; border-radius: 4px; margin-bottom: 14px;
      font-size: 13px; line-height: 1.5;
    }
    #detail-body .desc {
      color: var(--fg); font-size: 13px; line-height: 1.55;
      white-space: pre-wrap; word-wrap: break-word;
      margin-bottom: 14px;
    }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 12px; }
    .kv dt { color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-size: 10px; padding-top: 2px; }
    .kv dd { margin: 0; color: var(--fg); }
    .actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .actions button {
      background: var(--card-2); color: var(--fg);
      border: 1px solid var(--line); border-radius: 4px;
      padding: 7px 12px; font-size: 12px; cursor: pointer;
      letter-spacing: 1px;
    }
    .actions button:hover { border-color: var(--accent); color: var(--accent); }
    .actions button.ok { border-color: var(--good); color: var(--good); }

    .tt-block, .vms-block {
      margin-bottom: 14px; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 4px;
      background: var(--card-2);
    }
    .tt-block .head, .vms-block .head {
      font-size: 9px; letter-spacing: 2.5px; color: var(--muted);
      text-transform: uppercase; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .tt-block .head .status {
      font-family: 'JetBrains Mono', monospace; font-weight: 600;
    }
    .tt-block .head .status.red    { color: var(--bad); }
    .tt-block .head .status.amber  { color: var(--warn); }
    .tt-block .head .status.green  { color: var(--good); }
    .tt-block .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      font-family: 'JetBrains Mono', monospace;
    }
    .tt-block .grid .cell { background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
    .tt-block .grid .cell .v { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .tt-block .grid .cell .l { font-size: 9px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
    .tt-block .delta {
      margin-top: 10px; font-size: 12px; color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .tt-block .delta .n.bad   { color: var(--bad); }
    .tt-block .delta .n.warn  { color: var(--warn); }
    .tt-block .delta .n.good  { color: var(--good); }

    .vms-block .msg {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5;
      letter-spacing: 0.02em; padding: 10px 12px;
      background: var(--card); border: 1px solid var(--line); border-radius: 3px;
      white-space: pre-wrap; word-break: break-word;
    }

    .link-block {
      margin-bottom: 14px; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 4px;
      background: var(--card-2);
    }
    .link-block .head {
      font-size: 9px; letter-spacing: 2.5px; color: var(--muted);
      text-transform: uppercase; margin-bottom: 8px;
    }
    .link-block .row {
      display: grid; grid-template-columns: auto 1fr auto;
      gap: 10px; align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px; cursor: pointer;
    }
    .link-block .row:last-child { border-bottom: none; }
    .link-block .row:hover { background: rgba(255,87,34,0.04); }
    .link-block .conf {
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
      letter-spacing: 1.5px; padding: 2px 7px; border-radius: 999px;
      border: 1px solid var(--line);
      text-transform: uppercase;
    }
    .link-block .conf.high   { color: var(--bad);  border-color: rgba(248,113,113,0.4); }
    .link-block .conf.medium { color: var(--warn); border-color: rgba(251,191,36,0.4); }
    .link-block .conf.low    { color: var(--muted); }
    .link-block .row .label { color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
    .link-block .row .meta {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--muted); white-space: nowrap;
    }
    .link-block .row .meta.bad  { color: var(--bad); }
    .link-block .row .meta.warn { color: var(--warn); }

    .cam-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px;
    }
    .cam-tile {
      background: var(--card-2); border: 1px solid var(--line);
      border-radius: 4px; overflow: hidden; cursor: pointer;
    }
    .cam-tile:hover { border-color: var(--accent); }
    .cam-tile img { width: 100%; height: 110px; object-fit: cover; background: #000; display: block; }
    .cam-tile .meta { padding: 6px 10px; }
    .cam-tile .meta .n { font-size: 11px; color: var(--fg); }
    .cam-tile .meta .d {
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
      color: var(--muted); letter-spacing: 1.5px;
    }

    /* Camera modal */
    #cam-modal {
      position: fixed; inset: 0;
      background: rgba(10,10,11,0.92);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #cam-modal.on { display: flex; }
    #cam-modal img {
      max-width: 90vw; max-height: 80vh;
      border: 1px solid var(--line);
    }
    #cam-modal .cap {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      color: var(--fg); font-size: 14px;
      background: var(--card); padding: 8px 16px;
      border: 1px solid var(--line); border-radius: 4px;
    }

    #detail-map { height: 220px; border: 1px solid var(--line); border-radius: 4px; }
    .leaflet-container { background: var(--bg); }

    .pin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg); box-shadow: 0 0 8px rgba(0,0,0,0.6); }
    .pin.red   { background: var(--bad); }
    .pin.amber { background: var(--warn); }
    .pin.green { background: var(--good); }
    .pin.blue  { background: #60a5fa; }
  </style>
</head>
<body>
  <div id="root">
    <header>
      <div class="brand">
        <div class="small mono">TRAVEL · NAR · PRESENTER</div>
        <div class="name">Now Ayrshire Radio <span class="accent">Travel Desk</span></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="updated mono" id="updated">loading…</div>
    </header>

    <div id="filters">
      <input class="search" id="q" type="search" placeholder="Search road, town, description…" />
      <select id="f-town"><option value="">All towns</option></select>
      <select id="f-road"><option value="">All roads</option></select>
      <select id="f-type"><option value="">All types</option></select>
      <div class="seg" role="group">
        <button data-sev="" class="on">All</button>
        <button data-sev="red" class="red">Red</button>
        <button data-sev="amber" class="amber">Amber</button>
      </div>
      <div class="seg" role="group">
        <button data-grp="severity" class="on">By severity</button>
        <button data-grp="town">By town</button>
        <button data-grp="road">By road</button>
      </div>
      <button class="reset" id="delayed-only" title="Show only travel-time segments with delays">Delayed only</button>
      <button class="reset" id="reset">Reset</button>
    </div>

    <div id="list-wrap"><div id="list"></div></div>

    <section id="detail">
      <div id="detail-empty">Select an item to see details</div>
      <div id="detail-body" style="display:none"></div>
    </section>
  </div>

  <div id="cam-modal">
    <img id="cam-modal-img" alt="">
    <div class="cap" id="cam-modal-cap"></div>
  </div>

<script>
const POLL_MS = 60_000;

let allItems = [];
let facets = { towns: [], roads: [], types: [] };
let dataUpdatedAt = null;
let activeId = null;
let detailMap = null;
let detailMarker = null;

const filters = { q: '', town: '', road: '', type: '', severity: '', delayedOnly: false };
let groupBy = 'severity';

// ─── Fetch ────────────────────────────────────────────────────────────────
async function refresh() {
  try {
    const r = await fetch('/api/presenter', { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    allItems = d.items || [];
    facets = d.facets || { towns: [], roads: [], types: [] };
    dataUpdatedAt = d.data_updated_at;
    populateFacets();
    renderStats(d.counts);
    renderList();
    if (activeId) {
      const it = allItems.find(i => i.id === activeId);
      if (it) renderDetail(it);
    }
    document.getElementById('updated').textContent =
      dataUpdatedAt ? `Updated ${formatTime(new Date(dataUpdatedAt))}` : '';
  } catch (e) {
    document.getElementById('updated').textContent = 'Refresh failed';
    console.error(e);
  }
}

function formatTime(d) {
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function populateFacets() {
  fillSelect('f-town', facets.towns, 'All towns');
  fillSelect('f-road', facets.roads, 'All roads');
  fillSelect('f-type', facets.types, 'All types');
}
function fillSelect(id, opts, blank) {
  const el = document.getElementById(id);
  const cur = el.value;
  el.innerHTML = `<option value="">${blank}</option>` +
    opts.map(o => `<option value="${escapeAttr(o)}">${escapeHtml(o)}</option>`).join('');
  if (cur && opts.includes(cur)) el.value = cur;
}

function renderStats(c) {
  const el = document.getElementById('stats');
  if (!c) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <span class="stat red"><span class="n">${c.red||0}</span>red</span>
    <span class="stat amber"><span class="n">${c.amber||0}</span>amber</span>
    <span class="stat"><span class="n">${c.incidents||0}</span>incidents</span>
    <span class="stat"><span class="n">${c.roadworks||0}</span>roadworks</span>
    <span class="stat"><span class="n">${c.tro||0}</span>orders</span>
    <span class="stat"><span class="n">${c.ferry||0}</span>ferries</span>
  `;
}

// ─── Filtering ────────────────────────────────────────────────────────────
function applyFilters(items) {
  const q = filters.q.toLowerCase();
  return items.filter(i => {
    if (filters.severity && (i.severity || '').toLowerCase() !== filters.severity) return false;
    if (filters.town && i.town !== filters.town) return false;
    if (filters.road && i.road !== filters.road) return false;
    if (filters.type && i.type !== filters.type) return false;
    if (filters.delayedOnly) {
      const tt = i.travel_time_data;
      if (!tt) return false;
      const delay = ((tt.travel_time_seconds || 0) - (tt.free_flow_seconds || 0)) / 60;
      if (delay < 0.5 && (tt.congestion_ratio || 0) < 0.2) return false;
    }
    if (q) {
      const blob = `${i.title||''} ${i.description||''} ${i.road||''} ${i.town||''} ${i.summary||''}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function renderList() {
  const list = document.getElementById('list');
  const items = applyFilters(allItems);

  // Group
  const groups = new Map();
  for (const it of items) {
    let key;
    if (groupBy === 'town') key = it.town || '— Trunk / Regional —';
    else if (groupBy === 'road') key = it.road || '— Off trunk —';
    else key = severityBucket(it.severity);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }

  // Order group keys
  const keys = [...groups.keys()];
  if (groupBy === 'severity') {
    const ord = { 'Red': 0, 'Amber': 1, 'Info': 2, 'Green': 3 };
    keys.sort((a, b) => (ord[a] ?? 99) - (ord[b] ?? 99));
  } else {
    keys.sort((a, b) => a.localeCompare(b));
  }

  let html = '';
  if (!items.length) {
    html = '<div class="group-head">No items match the current filters</div>';
  }
  for (const k of keys) {
    const bucket = groups.get(k);
    bucket.sort((a, b) => (b.score || 0) - (a.score || 0));
    html += `<div class="group-head mono">${escapeHtml(k)}<span class="n mono">${bucket.length}</span></div>`;
    for (const it of bucket) {
      const sev = (it.severity || '').toLowerCase();
      const sevCls = ['red','amber','green'].includes(sev) ? sev : 'info';
      const noRoad = it.road ? '' : 'no-road';
      const sub = [it.town, it.type, it.source].filter(Boolean).join(' · ');
      html += `<div class="row ${noRoad} ${activeId === it.id ? 'active' : ''}" data-id="${escapeAttr(it.id)}">
        <div class="road">${escapeHtml(it.road || '—')}</div>
        <div class="body">
          <div class="title">${escapeHtml(it.title || it.summary || '')}</div>
          <div class="meta">${escapeHtml(sub)}</div>
        </div>
        <div class="sev ${sevCls}">${sev || '·'}</div>
      </div>`;
    }
  }
  list.innerHTML = html;
  list.querySelectorAll('.row').forEach(node => {
    node.addEventListener('click', () => {
      const id = node.dataset.id;
      const it = allItems.find(i => String(i.id) === String(id));
      if (it) selectItem(it);
    });
  });
}

function severityBucket(sev) {
  const s = (sev || '').toLowerCase();
  if (s === 'red') return 'Red';
  if (s === 'amber') return 'Amber';
  if (s === 'green') return 'Green';
  return 'Info';
}

function selectItem(it) {
  activeId = it.id;
  document.querySelectorAll('.row').forEach(n => n.classList.toggle('active', n.dataset.id === String(it.id)));
  renderDetail(it);
}

function renderDetail(it) {
  document.getElementById('detail-empty').style.display = 'none';
  const body = document.getElementById('detail-body');
  body.style.display = 'block';

  const sev = (it.severity || '').toLowerCase();
  const sevLabel = sev ? sev.toUpperCase() : '';
  const meta = [
    sevLabel,
    it.type,
    it.road,
    it.town,
    it.region ? it.region + ' Ayrshire' : null,
    it.source,
  ].filter(Boolean).join(' · ');

  let pubLine = '';
  if (it.pub_date) {
    try { pubLine = `Published ${formatTime(new Date(it.pub_date))}`; } catch {}
  }

  body.innerHTML = `
    <div class="sub mono">${escapeHtml(meta)}</div>
    <h2>${escapeHtml(it.title || it.summary || '')}</h2>
    <div class="summary-card">${escapeHtml(it.summary || '')}</div>
    ${it.description ? `<div class="desc">${escapeHtml(it.description)}</div>` : ''}
    ${renderTravelTimeBlock(it.travel_time_data)}
    ${renderVmsBlock(it.vms_data)}
    ${renderCausesBlock(it.caused_by)}
    ${renderImpactsBlock(it.impacts)}
    ${renderCamerasBlock(it.cameras)}
    <div class="actions">
      <button id="copy-summary">Copy summary</button>
      <button id="copy-detail">Copy full detail</button>
      ${it.url ? `<a href="${escapeAttr(it.url)}" target="_blank" rel="noopener"><button>Open source</button></a>` : ''}
    </div>
    <dl class="kv">
      ${it.road ? `<dt>Road</dt><dd>${escapeHtml(it.road)}</dd>` : ''}
      ${it.town ? `<dt>Town</dt><dd>${escapeHtml(it.town)}</dd>` : ''}
      ${it.region ? `<dt>Region</dt><dd>${escapeHtml(it.region)} Ayrshire</dd>` : ''}
      ${it.source ? `<dt>Source</dt><dd>${escapeHtml(it.source)}</dd>` : ''}
      ${pubLine ? `<dt>When</dt><dd>${escapeHtml(pubLine)}</dd>` : ''}
      ${(it.lat != null && it.lon != null) ? `<dt>Coords</dt><dd class="mono">${it.lat.toFixed(4)}, ${it.lon.toFixed(4)}</dd>` : ''}
    </dl>
    ${(it.lat != null && it.lon != null) ? `<div id="detail-map" style="margin-top:14px"></div>` : ''}
  `;

  if (it.lat != null && it.lon != null) {
    if (!detailMap || !document.getElementById('detail-map')._leaflet_id) {
      detailMap = L.map('detail-map', { zoomControl: false, attributionControl: false }).setView([it.lat, it.lon], 13);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(detailMap);
    } else {
      detailMap.setView([it.lat, it.lon], 13);
    }
    if (detailMarker) detailMarker.remove();
    detailMarker = L.marker([it.lat, it.lon], { icon: pinIcon(it.severity, it.type) }).addTo(detailMap);
  }

  document.getElementById('copy-summary')?.addEventListener('click', () => copyText(it.summary || it.title || '', 'copy-summary'));
  document.getElementById('copy-detail')?.addEventListener('click', () => {
    const lines = [
      it.summary || it.title || '',
      it.description || '',
      it.road ? `Road: ${it.road}` : '',
      it.town ? `Near: ${it.town}` : '',
      pubLine || '',
      it.url || '',
    ].filter(Boolean);
    copyText(lines.join('\n'), 'copy-detail');
  });
}

function copyText(t, btnId) {
  navigator.clipboard.writeText(t).then(() => {
    const b = document.getElementById(btnId);
    if (!b) return;
    const orig = b.textContent;
    b.textContent = 'Copied';
    b.classList.add('ok');
    setTimeout(() => { b.textContent = orig; b.classList.remove('ok'); }, 1200);
  });
}

function renderTravelTimeBlock(tt) {
  if (!tt) return '';
  const cur = (tt.travel_time_seconds || 0) / 60;
  const ff = (tt.free_flow_seconds || 0) / 60;
  const norm = (tt.normal_seconds || 0) / 60;
  const delta = cur - ff;
  const cr = tt.congestion_ratio || 0;
  let status = 'green';
  if (cr >= 0.5 || delta >= 5) status = 'red';
  else if (cr >= 0.2 || delta >= 1.5) status = 'amber';
  const dCls = status === 'red' ? 'bad' : status === 'amber' ? 'warn' : 'good';
  const dSign = delta >= 0 ? '+' : '';
  let measured = '';
  if (tt.measured_at) {
    try { measured = ` · measured ${new Date(tt.measured_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`; } catch {}
  }
  return `<div class="tt-block">
    <div class="head"><span>Live travel time${measured}</span><span class="status ${status}">${escapeHtml(tt.status || status.toUpperCase())}</span></div>
    <div class="grid">
      <div class="cell"><div class="v">${cur.toFixed(1)}m</div><div class="l">Now</div></div>
      <div class="cell"><div class="v">${ff.toFixed(1)}m</div><div class="l">Free flow</div></div>
      <div class="cell"><div class="v">${norm.toFixed(1)}m</div><div class="l">Normal</div></div>
    </div>
    <div class="delta">Δ vs free flow <span class="n ${dCls}">${dSign}${delta.toFixed(1)}m</span> · congestion ratio <span class="n ${dCls}">${cr.toFixed(2)}</span></div>
  </div>`;
}

function renderCausesBlock(causes) {
  if (!causes || !causes.length) return '';
  const rows = causes.map(c => {
    const lbl = (c.summary || '').replace(/^\[(RED|AMBER)\]\s*/i, '');
    return `<div class="row" data-id="${escapeAttr(c.id)}">
      <span class="conf ${c.confidence}">${c.confidence}</span>
      <span class="label">${escapeHtml(lbl)}</span>
      <span class="meta">${c.distance_km}km · ${escapeHtml(c.type || '')}</span>
    </div>`;
  }).join('');
  return `<div class="link-block">
    <div class="head">Likely causes (same road, nearby)</div>
    ${rows}
  </div>`;
}

function renderImpactsBlock(impacts) {
  if (!impacts || !impacts.length) return '';
  const rows = impacts.map(i => {
    const cls = i.delay_min >= 5 ? 'bad' : i.delay_min >= 1.5 ? 'warn' : '';
    return `<div class="row" data-id="${escapeAttr(i.id)}">
      <span class="conf ${i.confidence}">${i.confidence}</span>
      <span class="label">${escapeHtml(i.name || '')}</span>
      <span class="meta ${cls}">+${i.delay_min}m · ${escapeHtml(i.status || '')}</span>
    </div>`;
  }).join('');
  return `<div class="link-block">
    <div class="head">Observed impact (delayed segments nearby)</div>
    ${rows}
  </div>`;
}

function renderCamerasBlock(cams) {
  if (!cams || !cams.length) return '';
  const tiles = cams.map(c =>
    `<div class="cam-tile" data-cam="${escapeAttr(c.url)}" data-name="${escapeAttr(c.name)}">
       <img src="${camUrl(c.url)}" alt="${escapeAttr(c.name)}">
       <div class="meta"><div class="n">${escapeHtml(c.name)}</div><div class="d">${c.distance_km} km</div></div>
     </div>`
  ).join('');
  return `<div class="link-block">
    <div class="head">Nearby cameras (auto-refresh ${PRESENTER_CAM_REFRESH_S}s)</div>
    <div class="cam-grid">${tiles}</div>
  </div>`;
}

const PRESENTER_CAM_REFRESH_S = 60;
let presenterCamKey = Date.now();
function camUrl(url) {
  const sep = url.includes('?') ? '&' : '?';
  return `${url}${sep}t=${presenterCamKey}`;
}

setInterval(() => {
  presenterCamKey = Date.now();
  document.querySelectorAll('.cam-tile img, #cam-modal-img').forEach(img => {
    const baseSrc = (img.dataset.base) || img.src.split('?')[0];
    img.dataset.base = baseSrc;
    img.src = `${baseSrc}?t=${presenterCamKey}`;
  });
}, PRESENTER_CAM_REFRESH_S * 1000);

function openCamModal(url, name) {
  const modal = document.getElementById('cam-modal');
  document.getElementById('cam-modal-img').src = camUrl(url);
  document.getElementById('cam-modal-cap').textContent = name || '';
  modal.classList.add('on');
}
document.getElementById('cam-modal').addEventListener('click', () => {
  document.getElementById('cam-modal').classList.remove('on');
});

// Wire link-block + cam-tile clicks (event delegation on body, since detail re-renders)
document.body.addEventListener('click', (e) => {
  const tile = e.target.closest('.cam-tile');
  if (tile) {
    e.stopPropagation();
    openCamModal(tile.dataset.cam, tile.dataset.name);
    return;
  }
  const linkRow = e.target.closest('.link-block .row');
  if (linkRow) {
    const id = linkRow.dataset.id;
    const it = allItems.find(i => String(i.id) === String(id));
    if (it) selectItem(it);
  }
});

function renderVmsBlock(v) {
  if (!v) return '';
  const msg = v.message || '';
  let timeLine = '';
  if (v.time_set) {
    try { timeLine = ` · set ${new Date(v.time_set).toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' })}`; } catch {}
  }
  const working = v.working === false ? '<span style="color:var(--bad)">SIGN OFFLINE</span>' : '';
  return `<div class="vms-block">
    <div class="head"><span>VMS message${timeLine}</span>${working}</div>
    <div class="msg">${escapeHtml(msg)}</div>
  </div>`;
}

function pinIcon(severity, type) {
  const sev = (severity || '').toLowerCase();
  let cls = 'green';
  if (sev === 'red') cls = 'red';
  else if (sev === 'amber') cls = 'amber';
  if (type === 'roadworks' && sev !== 'red') cls = 'amber';
  if (type === 'ferry') cls = 'blue';
  return L.divIcon({ className: '', html: `<div class="pin ${cls}"></div>`, iconSize: [12, 12], iconAnchor: [6, 6] });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g,'&#96;'); }

// ─── Bind UI ──────────────────────────────────────────────────────────────
document.getElementById('q').addEventListener('input', e => { filters.q = e.target.value.trim(); renderList(); });
document.getElementById('f-town').addEventListener('change', e => { filters.town = e.target.value; renderList(); });
document.getElementById('f-road').addEventListener('change', e => { filters.road = e.target.value; renderList(); });
document.getElementById('f-type').addEventListener('change', e => { filters.type = e.target.value; renderList(); });
document.querySelectorAll('.seg [data-sev]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.seg [data-sev]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    filters.severity = b.dataset.sev;
    renderList();
  });
});
document.querySelectorAll('.seg [data-grp]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.seg [data-grp]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    groupBy = b.dataset.grp;
    renderList();
  });
});
document.getElementById('delayed-only').addEventListener('click', (e) => {
  filters.delayedOnly = !filters.delayedOnly;
  e.currentTarget.style.color = filters.delayedOnly ? 'var(--accent)' : '';
  e.currentTarget.style.borderColor = filters.delayedOnly ? 'var(--accent)' : '';
  if (filters.delayedOnly) {
    // also flip type to travel_time for clarity
    filters.type = 'travel_time';
    document.getElementById('f-type').value = 'travel_time';
  }
  renderList();
});

document.getElementById('reset').addEventListener('click', () => {
  filters.q = ''; filters.town = ''; filters.road = ''; filters.type = ''; filters.severity = '';
  filters.delayedOnly = false;
  const dBtn = document.getElementById('delayed-only');
  dBtn.style.color = ''; dBtn.style.borderColor = '';
  groupBy = 'severity';
  document.getElementById('q').value = '';
  document.getElementById('f-town').value = '';
  document.getElementById('f-road').value = '';
  document.getElementById('f-type').value = '';
  document.querySelectorAll('.seg [data-sev]').forEach(b => b.classList.toggle('on', b.dataset.sev === ''));
  document.querySelectorAll('.seg [data-grp]').forEach(b => b.classList.toggle('on', b.dataset.grp === 'severity'));
  renderList();
});

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
