      if (day.ends && day.ends.length) {
        sections.push(`<div style="margin-bottom:6px"><span style="color:var(--good);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase">■ Ending</span>` +
          day.ends.slice(0, 5).map(s => `<div class="rp-row" data-flyto="${s.lat || ''},${s.lon || ''}"><div><div class="label">${escapeHtml((s.title||'').slice(0,90))}</div><div class="meta">${escapeHtml((s.description||'').slice(0,60))}</div></div></div>`).join('') + `</div>`);
      }
      if (!sections.length) sections.push('<div class="rp-empty" style="font-size:10px">— no schedule changes —</div>');
      return `<div class="rp-section">
        <h4>${day.weekday} <span style="color:var(--fg-soft);margin-left:4px">${day.date.slice(8)}/${day.date.slice(5,7)}</span>${isToday ? ' <span style="color:var(--accent);font-size:9px;margin-left:6px">TODAY</span>' : ''}<span class="n">${day.active_count} active</span></h4>
        ${sections.join('')}
      </div>`;
    }).join('');
    body.querySelectorAll('[data-flyto]').forEach(node => {
      node.addEventListener('click', () => {
        const [lat, lon] = node.dataset.flyto.split(',').map(parseFloat);
        if (!isNaN(lat) && !isNaN(lon)) map.flyTo([lat, lon], 13, { duration: 0.5 });
      });
    });
  } catch (e) {
    body.innerHTML = '<div class="rp-empty">Could not load calendar</div>';
    console.error('[calendar]', e);
  }
}

document.getElementById('btn-calendar').addEventListener('click', openCalendar);

// ─── Events map layer (Pavilion Festival etc.) ──────────────────────────
const eventsLayer = L.layerGroup();
let eventsVisible = false;

async function refreshEvents() {
  if (!eventsVisible) return;
  try {
    const r = await fetch('/api/events', { cache: 'no-store' });
    const d = await r.json();
    eventsLayer.clearLayers();
    for (const ev of (d.events || [])) {
      if (ev.lat == null || ev.lon == null) continue;
      const m = L.marker([ev.lat, ev.lon], {
        icon: L.divIcon({ className: '', html: `<div class="event-marker">🎫</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }),
      });
      const startTxt = ev.starts ? new Date(ev.starts).toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' }) : '';
      m.bindPopup(`<strong>${escapeHtml(ev.name)}</strong><br><span style="color:#8a8a90;font-size:10px">${escapeHtml(ev.address || '')}</span>${startTxt ? `<br><span style="font-family:monospace;font-size:10px;color:#a78bfa">${startTxt}</span>` : ''}`, { maxWidth: 280 });
      eventsLayer.addLayer(m);
    }
  } catch (e) { console.error('[events]', e); }
}

document.getElementById('toggle-events').addEventListener('click', (e) => {
  eventsVisible = !eventsVisible;
  e.currentTarget.classList.toggle('on', eventsVisible);
  if (eventsVisible) {
    eventsLayer.addTo(map);
    refreshEvents();
  } else {
    map.removeLayer(eventsLayer);
  }
});

// ─── Cmd-K search overlay ───────────────────────────────────────────────
let searchIndex = [];
let searchActiveIdx = 0;

function buildSearchIndex(d) {
  const items = [];
  for (const t of (d.top || [])) {
    items.push({
      id: t.id, kind: t.type, severity: t.severity,
      label: t.summary || t.title || '',
      meta: [t.road, t.town].filter(Boolean).join(' · '),
      lat: t.lat, lon: t.lon,
      road: t.road,
      blob: `${t.road||''} ${t.town||''} ${t.summary||''} ${t.type||''}`.toLowerCase(),
    });
  }
  for (const w of (d.worst_delays || [])) {
    items.push({
      id: w.id, kind: 'delay', severity: w.delay_min >= 5 ? 'red' : 'amber',
      label: `${w.road} · ${w.name} · +${w.delay_min}m`,
      meta: `${w.status || ''} · current ${w.current_min}m vs free flow ${w.freeflow_min}m`,
      lat: w.lat, lon: w.lon, road: w.road,
      blob: `${w.road||''} ${w.name||''} ${w.status||''} delay`.toLowerCase(),
    });
  }
  for (const r of (d.trunk || [])) {
    if (r.status === 'green') continue;
    items.push({
      id: `trunk-${r.road}`, kind: 'road', severity: r.status,
      label: `${r.road} — ${r.status.toUpperCase()} · +${r.delay_min}m delay · ${r.delayed_segments}/${r.total_segments} segments slow`,
      meta: `${r.incidents} live · ${r.roadworks} works`,
      road: r.road,
      blob: `${r.road} road delay`.toLowerCase(),
    });
  }
  for (const t of (d.towns || [])) {
    if (t.status === 'clear') continue;
    items.push({
      id: `town-${t.town}`, kind: 'town', severity: t.status === 'red' ? 'red' : t.status === 'amber' ? 'amber' : 'info',
      label: `${t.town} — ${t.count} item${t.count === 1 ? '' : 's'}`,
      meta: `${t.region} Ayrshire`,
      lat: (t.top && t.top[0]) ? t.top[0].lat : null,
      lon: (t.top && t.top[0]) ? t.top[0].lon : null,
      blob: `${t.town} ${t.region}`.toLowerCase(),
    });
  }
  searchIndex = items;
}

function renderSearchResults(q) {
  const el = document.getElementById('search-results');
  searchActiveIdx = 0;
  if (!q) {
    el.innerHTML = '<div id="search-empty">Type to search across roads, towns, segments, incidents…</div>';
    return;
  }
  const ql = q.toLowerCase();
  const matches = searchIndex.filter(i => i.blob.includes(ql)).slice(0, 30);
  if (!matches.length) {
    el.innerHTML = '<div id="search-empty">No matches</div>';
    return;
  }
  el.innerHTML = matches.map((m, i) => {
    const sev = (m.severity || '').toLowerCase();
    const sevCls = ['red','amber'].includes(sev) ? sev : 'info';
    return `<div class="search-result ${sevCls} ${i === 0 ? 'active' : ''}" data-idx="${i}" data-lat="${m.lat || ''}" data-lon="${m.lon || ''}" data-road="${escapeAttr(m.road || '')}">
      <span class="badge">${escapeHtml((m.road || m.kind || '').toUpperCase())}</span>
      <div>
        <div class="label">${escapeHtml(m.label)}</div>
        ${m.meta ? `<div class="meta">${escapeHtml(m.meta)}</div>` : ''}
      </div>
      <span class="kind">${escapeHtml(m.kind)}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.search-result').forEach(node => {
    node.addEventListener('click', () => activateSearchResult(node));
    node.addEventListener('mouseenter', () => {
      el.querySelectorAll('.search-result').forEach(n => n.classList.remove('active'));
      node.classList.add('active');
      searchActiveIdx = parseInt(node.dataset.idx);
    });
  });
}

function activateSearchResult(node) {
  const lat = parseFloat(node.dataset.lat);
  const lon = parseFloat(node.dataset.lon);
  const road = node.dataset.road;
  closeSearch();
  if (road && /^[AM]\d+$/.test(road)) {
    openRoadPanel(road);
  } else if (!isNaN(lat) && !isNaN(lon)) {
    map.flyTo([lat, lon], 13, { duration: 0.5 });
  }
}

function openSearch() {
  document.getElementById('search-modal').classList.add('on');
  const inp = document.getElementById('search-input');
  inp.value = '';
  renderSearchResults('');
  setTimeout(() => inp.focus(), 50);
}
function closeSearch() {
  document.getElementById('search-modal').classList.remove('on');
}
document.getElementById('btn-search').addEventListener('click', openSearch);
document.getElementById('search-input').addEventListener('input', (e) => renderSearchResults(e.target.value.trim()));
document.getElementById('search-input').addEventListener('keydown', (e) => {
  const results = document.querySelectorAll('#search-results .search-result');
  if (e.key === 'Escape') { closeSearch(); return; }
  if (e.key === 'Enter') {
    const active = document.querySelector('#search-results .search-result.active');
    if (active) activateSearchResult(active);
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!results.length) return;
    searchActiveIdx = (searchActiveIdx + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
    results.forEach((r, i) => r.classList.toggle('active', i === searchActiveIdx));
    results[searchActiveIdx].scrollIntoView({ block: 'nearest' });
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    openSearch();
  }
});
document.getElementById('search-modal').addEventListener('click', (e) => {
  if (e.target.id === 'search-modal') closeSearch();
});

// ─── Fetch loop ──────────────────────────────────────────────────────────
async function refresh() {
  try {
    const r = await fetch('/api/studio', { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    lastStudioData = d;
    camRefreshKey = Date.now();
    safeRender('headline', () => renderHeadline(d.headline));
    safeRender('top',      () => renderTop(d.top));
    safeRender('delays',   () => renderDelays(d.worst_delays || []));
    safeRender('towns',    () => renderTowns(d.towns));
    safeRender('trunk',    () => renderTrunk(d.trunk));
    safeRender('map',      () => renderMap(d.top));
    safeRender('heatmap',  () => renderHeatmap(d.heatmap || []));
    safeRender('vms',      () => renderVms(d.vms || []));
    safeRender('cams',     () => renderCamCarousel(d.cameras_relevant || []));
    safeRender('cams-map', () => renderCamerasOnMap(d.cameras_all || []));
    safeRender('chime',    () => checkForNewRed(d.top || []));
    safeRender('search-idx', () => buildSearchIndex(d));
    safeRender('events-map', () => refreshEvents());
    if (d.data_updated_at) {
      const dt = new Date(d.data_updated_at);
      document.getElementById('updated').textContent =
        `Source updated ${fmtTime(dt)} · refreshes every minute`;
    }
  } catch (e) {
    document.getElementById('updated').textContent = 'Refresh failed — retrying';
    console.error(e);
  }
}
refresh();
setInterval(refresh, POLL_MS);

refreshWeather();
setInterval(refreshWeather, WEATHER_REFRESH_MS);
refreshWarnings();
setInterval(refreshWarnings, WEATHER_REFRESH_MS);
</script>
